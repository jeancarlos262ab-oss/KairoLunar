[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarapi"
version = "0.1.0"
description = "REST API that serves the lunar south pole pipeline outputs (horizons, terrain, ephemeris) and derived illumination/visibility analyses."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lunarapi = "lunarapi.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
