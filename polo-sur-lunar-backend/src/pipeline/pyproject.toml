[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarpipe"
version = "0.1.0"
description = "Data pipeline for lunar south pole DEM processing, horizon masks, terrain downsampling, and SPICE ephemerides."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "spiceypy>=6.0",
    "rasterio>=1.3",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
numba = ["numba>=0.59"]
test = ["pytest>=8"]
dev = [
    "numba>=0.59",
    "pytest>=8",
]

[project.scripts]
lunarpipe-build = "lunarpipe.build:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
